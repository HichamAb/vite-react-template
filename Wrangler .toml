name = "hoco-cod"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# ═══ D1 Database (Cloudflare SQLite — مجاني) ═══
# بعد إنشاء المشروع شغّل:
# npx wrangler d1 create hoco-orders
# انسخ الـ database_id وضعه هنا ↓
[[d1_databases]]
binding  = "DB"
database_name = "hoco-orders"
database_id   = "PASTE-YOUR-DATABASE-ID-HERE"

# ═══ Static assets ═══
[assets]
directory = "./dist/client"

# ═══ Environment Variables ═══
# ضعها في Cloudflare Dashboard → Settings → Variables
# أو هنا للتطوير المحلي فقط (لا ترفعها لـ git)
[vars]
# GAS_URL = "https://script.google.com/macros/s/xxx/exec"
